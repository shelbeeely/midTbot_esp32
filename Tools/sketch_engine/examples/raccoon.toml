kind = "eye"
center = [26.0, 36.6]
iris = 1.6
width = 3.4
tilt = 6
highlight = [-0.3, -0.45]
ellipses = [[26.0, 36.6, 1.65, 1.65, 0]]
inks = ["BLK"]
priority = 1

