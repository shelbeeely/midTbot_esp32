# Example subject for sketch_engine: a raccoon, from a public-domain photograph by Jim Osdale
# (Flickr, Public Domain Mark 1.0). Cropped to the head and chest.
#
# Units: the canvas is canvas_units wide/high; measure regions on `sketch.py grid raccoon.toml`.
# Regions are listed nearest/most specific first; earlier regions win where they overlap.

title = "raccoon"
photo = "raccoon.jpg"
canvas_units = [68, 94]
page_mm = [150, 207]
palette = "g2"
tip = "g2-0.38"
ink_model = "gel"
focus = [33.5, 40]          # the eyes: tone grows outward from here
corrections = true

# ---- regions: inks run light -> dark; priority 1 is carried furthest
