# journal_plot profile for drawing with a 4-colour ballpoint multipen (black, blue, red, green).
# Pairs with Firmware/FluidNC/midtbot_s3_multipen.yaml and Docs/multipen.md.
# Ballpoint ink is translucent and answers to pressure, so the preview draws light strokes
# faint and lets layers of colour mix where they cross.
#
#   python3 journal_plot.py examples/skyline_ballpoint.svg -p profile.ballpoint4.example.toml --preview

[pen]
z_up = 5.0
z_touch = 0.0
z_max = -1.6
line_width = 0.32   # a medium ballpoint: about 0.26 mm when light, 0.38 mm when firm
line_flex = 0.19
ink_min = 0.10      # barely there at the lightest touch
ink_max = 0.82      # nearly solid when pressed

[motion]
draw_feed = 1800
dwell_down = 0.05
dwell_up = 0.08

[pressure]
default = 0.4
min = 0.05
taper_in = 0.3
taper_out = 0.5

[page]
origin_x = 3.0
origin_y = 3.0
max_x = 100.0
max_y = 100.0

# One slot per refill. The select lines are placeholders: see Docs/multipen.md, calibration.
# Strokes go to the refill whose colour is nearest their colour in the drawing.
[slots.black]
color = "#1e1e24"
select = ["G0 A0", "G0 B10", "G4 P0.2", "G0 B0"]

[slots.red]
color = "#d62a34"
select = ["G0 A90", "G0 B10", "G4 P0.2", "G0 B0"]

[slots.blue]
color = "#263eac"
select = ["G0 A45", "G0 B10", "G4 P0.2", "G0 B0"]

[slots.green]
color = "#1c8a52"
select = ["G0 A135", "G0 B10", "G4 P0.2", "G0 B0"]
